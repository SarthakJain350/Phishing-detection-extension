version: "3.8"

services:
  # ============================================================================
  # PostgreSQL 16 Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: phishing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-phishing_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-phishing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # FastAPI Backend (Configured for Task 1.3 startup once routes are implemented)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: phishing_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/phishing_db
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    profiles:
      - full  # Active with `docker compose --profile full up` or in Task 1.3

volumes:
  pgdata:
    name: phishing_pgdata
